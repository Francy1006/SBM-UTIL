spring:
  application:
    name: SBM-UTIL

  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      probes:
        enabled: true

sbm:
  security:
    service-token: ${SBM_SERVICE_TOKEN}